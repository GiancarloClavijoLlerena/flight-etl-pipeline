services:
  mysql:
    image: mysql:8.4
    container_name: flight-etl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flight_etl_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init_oltp.sql:/docker-entrypoint-initdb.d/01_init_oltp.sql:ro
      - ./sql/seed_oltp.sql:/docker-entrypoint-initdb.d/02_seed_oltp.sql:ro
      - ./sql/init_olap.sql:/docker-entrypoint-initdb.d/03_init_olap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  etl:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flight_etl_password}
      OLTP_DATABASE: flight_management
      OLAP_DATABASE: flight_analytics
    volumes:
      - ./logs:/app/logs
    restart: "no"

volumes:
  mysql_data:
